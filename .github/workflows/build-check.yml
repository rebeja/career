name: Build check

# Builds the site on every pull request so problems show up before merging.
# This workflow never deploys; deployment stays in deploy-gh-pages.yml (main only).
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_VARIANT: external
        run: npm run build:external
